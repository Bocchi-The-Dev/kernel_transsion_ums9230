name: Build Kernel 5.15 (X6525)

# First milestone of the 5.4.302 -> 5.15.178 port.
#
# This branch is based on realme's android_kernel_realme_ums9230
# (realme/ums9230_v_15.0, 5.15.178), which is the only public tree carrying
# the qogirl6 (UMS9230) BSP newer than 5.4 -- no android12-5.10 qogirl6
# vendor tree exists.  The Infinix X6525 is handled by bg6_defconfig, the
# same config the 5.4 branch's CI builds.
#
# Scope of this workflow: build an arm64 Image on 5.15 and repack it into a
# flashable boot.img using the stock X6525 ramdisk (boot-gsi.img, carried over
# from the 5.4 branch).  It does not build vendor modules yet: the X6525
# modules (touch, fingerprint, charger, camera, mali) live in
# kernel_modules/kernel5.4 on the 5.4 branch and have no 5.15 counterpart here;
# realme ships theirs in the separate
# android_kernel_modules_and_devicetree_realme_ums9230 repo.
#
# The board's live device tree is sprd,ums9230-1h10-go ("Spreadtrum
# UMS9230-1H10-GO Board", model "ums9230 X6525"), read out of the dtbo
# partition entry 18 that androidboot.dtbo_idx=18 selects.  This tree already
# carries arch/arm64/boot/dts/sprd/ums9230-1h10_go-overlay.dts, so the stock
# dtbo partition keeps working and boot.img only has to carry the kernel.
#
# The config is the unmodified 5.4 bg6_defconfig on purpose: kconfig drops
# the symbols that no longer exist and takes 5.15 defaults for new ones, so
# the resulting .config/comparison shows exactly what needs porting instead
# of hiding it behind a hand-written fragment.

on:
  workflow_dispatch:
  push:
    branches: [ upstream-5.15, upstream-5.10 ]

jobs:
  build:
    runs-on: namespace-profile-compile
    env:
      CLANG_DIR: /tmp/clang-r416183b
      # Same toolchain and triple handling as the 5.4 workflow:
      # CROSS_COMPILE is what supplies clang's aarch64 target triple.
      MAKE_ARGS: LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # Compared with the 5.4 workflow this adds the host tooling that 5.15
          # needs and 5.4 did not:
          #   libelf-dev  - resolve_btfids/libbpf (CONFIG_DEBUG_INFO_BTF) build
          #                 the host tools from source here and fail without it
          #   zstd, lz4   - compression for initramfs/modules
          #   device-tree-compiler - dtb/dto builds (5.15 builds them separately)
          #   kmod        - depmod when modules are installed
          sudo apt-get install -y flex bison bc cpio libssl-dev libelf-dev \
            xz-utils zstd lz4 dwarves device-tree-compiler kmod \
            libc6-dev-arm64-cross jq

          # jq is for the Magisk release lookup in the boot.img stage.

      - name: Verify host tools
        run: |
          test -f /usr/include/libelf.h && test -f /usr/include/gelf.h
          pahole --version

      - name: Fetch the reference toolchain (clang-r416183b)
        run: |
          curl -sSL -o /tmp/clang.tar.gz \
            https://codeload.github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b/tar.gz/refs/heads/lineage-20.0
          mkdir -p "$CLANG_DIR"
          tar xzf /tmp/clang.tar.gz -C "$CLANG_DIR" --strip-components=1
          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          clang --version
          ld.lld --version
          llvm-ar --version | head -1

      - name: Configure (bg6_defconfig)
        run: |
          set -o pipefail
          make $MAKE_ARGS bg6_defconfig 2>&1 | tee /tmp/config.log
          echo "kernelrelease: $(make $MAKE_ARGS -s kernelrelease)"

      # Options that no longer exist in 5.15, or whose dependencies moved,
      # show up here.  This is the list to start the config port from.
      - name: Report config warnings
        if: always()
        run: |
          grep -iE '^\S*warning' /tmp/config.log | sort -u | head -200 || true

      - name: Build Image
        run: |
          set -o pipefail
          make $MAKE_ARGS -j$(nproc) Image 2>&1 | tee /tmp/build.log

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image-5.15-${{ github.sha }}
          path: out/arch/arm64/boot/Image
          if-no-files-found: error

      # bg6_defconfig has plenty of =m drivers (ZRAM, several SPRD blocks).
      # They are the next thing a boot needs, and building them exercises far
      # more of the 5.15 port than Image does.  -k keeps going after a broken
      # optional module and the status is only reported, like the 5.4 pipeline.
      - name: Build in-tree modules (best effort)
        run: |
          set +e
          make $MAKE_ARGS -k -j$(nproc) modules > /tmp/modules.log 2>&1
          status=$?
          grep -E 'error:|Error [0-9]' /tmp/modules.log | head -40
          tail -n 40 /tmp/modules.log
          echo "make modules exited with $status"
          if [ $status -eq 0 ]; then
            make $MAKE_ARGS INSTALL_MOD_PATH=$PWD/modinstall \
              INSTALL_MOD_STRIP=1 modules_install >> /tmp/modules.log 2>&1
            # modules_install drops build/source symlinks into the module dir;
            # the artifact uploader follows them and the artifact balloons to
            # ~2 GB, which makes downloads time out.
            rm -f modinstall/lib/modules/*/build modinstall/lib/modules/*/source
            find modinstall -name '*.ko' -printf '%f\n' | sort | head -40
            echo "module count: $(find modinstall -name '*.ko' | wc -l)"
            du -sh modinstall
          fi
          exit 0

      - name: Upload in-tree modules
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modules-5.15-${{ github.sha }}
          path: |
            modinstall/lib/modules/*
            /tmp/modules.log
          if-no-files-found: warn

      # The sprd Makefile is gated on the vendor build system's variables --
      # without BSP_BUILD_DT_OVERLAY/BSP_BUILD_ANDROID_OS every dtb-* line is
      # skipped and `make dtbs` produces nothing.  qogirl6 is the UMS9230
      # family, and ums9230-1h10_go is the X6525 board (the live device tree is
      # "sprd,ums9230-1h10-go"), so this proves the dts port as well as being
      # the base for a 5.15 dtbo image later.  Kept non-fatal: the stock dtbo
      # partition already carries this board's DTB, so a dts failure must not
      # block boot.img.
      - name: Build device trees (ums9230-1h10-go)
        continue-on-error: true
        run: |
          set -o pipefail
          make $MAKE_ARGS -j$(nproc) \
            BSP_BUILD_DT_OVERLAY=y BSP_BUILD_ANDROID_OS=y BSP_BUILD_FAMILY=qogirl6 \
            dtbs 2>&1 | tee /tmp/dtbs.log | tail -60
          find out/arch/arm64/boot/dts/sprd -maxdepth 1 \
            \( -name '*.dtb' -o -name '*.dtbo' \) -printf '%f %s\n' | sort | head -30

      - name: Upload device trees
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dtbs-5.15-${{ github.sha }}
          path: |
            out/arch/arm64/boot/dts/sprd/*.dtb
            out/arch/arm64/boot/dts/sprd/*.dtbo
            /tmp/dtbs.log
          if-no-files-found: warn

      # boot-gsi.img is the stock X6525 boot image (header v4, 1.5 MB ramdisk,
      # the "androidboot.verifiedbootstate=disabled buildvariant=userdebug
      # androidboot.selinux=permissive kvm-arm.mode=nvhe" cmdline) whose kernel
      # slot has been swapped before.  Repacking it with the 5.15 Image keeps
      # the stock ramdisk and cmdline, so the result is flashable to boot_a on
      # its own -- no need to rebuild the ramdisk.
      - name: Pack boot.img (magiskboot)
        run: |
          curl -sSL -o /tmp/magisk.apk \
            "$(curl -s https://api.github.com/repos/topjohnwu/Magisk/releases/latest \
               | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url' \
               | head -1)"
          unzip -o -j /tmp/magisk.apk 'lib/x86_64/libmagiskboot.so' -d /tmp
          chmod +x /tmp/libmagiskboot.so
          mkdir -p /tmp/bootwork && cd /tmp/bootwork
          /tmp/libmagiskboot.so unpack "$GITHUB_WORKSPACE/boot-gsi.img"
          cp "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image" kernel
          /tmp/libmagiskboot.so repack "$GITHUB_WORKSPACE/boot-gsi.img"
          mv new-boot.img "$GITHUB_WORKSPACE/boot.img"
          ls -la "$GITHUB_WORKSPACE/boot.img"

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: boot-5.15-${{ github.sha }}
          path: boot.img
          if-no-files-found: error

      - name: Upload .config and configure log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: config-5.15-${{ github.sha }}
          # upload-artifact@v4 drops dotfiles unless asked; without this the
          # artifact only ever contains the configure log.
          include-hidden-files: true
          path: |
            out/.config
            /tmp/config.log
          if-no-files-found: warn
