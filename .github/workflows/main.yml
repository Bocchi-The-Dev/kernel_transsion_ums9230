name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches: [ upstream-302, master, susfs, susfs-testing ]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      # NB: keep this a literal -- the `runner` context is not available in
      # jobs.<id>.env, and referencing it there fails workflow validation.
      CLANG_DIR: /tmp/clang-r416183b
      # Mirror of what the vendor's own build config uses:
      #
      #   build.config.common : LLVM=1
      #                         CLANG_PREBUILT_BIN=.../clang-r416183b/bin
      #   build.config.aarch64: ARCH=arm64
      #                         LLVM_IAS=1
      #                         CROSS_COMPILE=aarch64-linux-gnu-
      #
      # The CROSS_COMPILE prefix is load-bearing: it is what supplies clang's
      # target triple.  With ARCH=arm64 alone clang still compiles for the
      # host, and the arm64 inline asm dies with
      # "unknown register name 'x0' in asm" in asm/atomic_lse.h.
      MAKE_ARGS: LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # drivers/kernelsu is a symlink into the KernelSU-Next submodule, and
          # the top-level Makefile is what pulls it in (drivers/Makefile:
          # obj-$(CONFIG_KSU) += kernelsu/).  Without this the link dangles and
          # the build dies with "drivers/kernelsu: No such file or directory".
          submodules: recursive

      # ReSukiSU's kernel/Kbuild derives its version from git (rev-list --count
      # and git describe --abbrev=0 --tags).  actions/checkout below depth 1
      # leaves the submodule shallow and tag-less, so Kbuild falls back to the
      # placeholder "v4.1.0" name and a bogus 30000+1+700 version code.
      # Unshallow and pull tags so the driver reports its real v4.2.0-rc2 tag.
      - name: Expand KernelSU submodule history and tags
        run: |
          git -C KernelSU fetch --unshallow --tags

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # libc6-dev-arm64-cross supplies /usr/aarch64-linux-gnu/include, which
          # usr/include/Makefile adds to the UAPI header self-test.  That test is
          # cross-compiled with a bare AOSP clang and no sysroot, so without it
          # every UAPI header that includes a libc header (linux/virtio_ring.h ->
          # <stdint.h>, linux/dvb/video.h -> <time.h>) fails on a missing
          # glibc multilib header ('bits/libc-header-start.h',
          # 'bits/wordsize.h').  See the comment in usr/include/Makefile.
          sudo apt-get install -y flex bison bc cpio libssl-dev xz-utils dwarves \
            libc6-dev-arm64-cross

      - name: Fetch the reference toolchain (clang-r416183b)
        run: |
          curl -sSL -o /tmp/clang.tar.gz \
            https://codeload.github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b/tar.gz/refs/heads/lineage-20.0
          mkdir -p "$CLANG_DIR"
          tar xzf /tmp/clang.tar.gz -C "$CLANG_DIR" --strip-components=1
          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          clang --version
          ld.lld --version
          llvm-ar --version | head -1

      - name: Show kernel release
        run: |
          make $MAKE_ARGS bg6_defconfig
          echo "kernelrelease: $(make $MAKE_ARGS -s kernelrelease)"

      - name: Build Image
        run: |
          make $MAKE_ARGS -j$(nproc) Image

      # The TEE DVFS probe (SPRD_CPU_OC_PROBE) ships inside
      # sprd-cpufreq-v2.ko.  On this device the sprd cpufreq/public/sip
      # drivers are loadable modules packed into the vendor_boot ramdisk
      # (/lib/modules + modules.load), NOT built-in - the built-in (=y)
      # variant wedges the boot before USB comes up.  So the probe image is
      # the =m build + these three .ko swapped into vendor_boot.
      - name: Build sprd cpufreq/sip modules
        run: |
          make $MAKE_ARGS -j$(nproc) modules_prepare
          make $MAKE_ARGS -j$(nproc) \
            drivers/cpufreq/sprd-cpufreq-v2.ko \
            drivers/cpufreq/sprd-cpufreq-public.ko \
            drivers/firmware/sprd_sip_svc.ko
          ls -la out/drivers/cpufreq/sprd-cpufreq-v2.ko \
                out/drivers/cpufreq/sprd-cpufreq-public.ko \
                out/drivers/firmware/sprd_sip_svc.ko

      - name: Upload sprd cpufreq/sip modules
        uses: actions/upload-artifact@v4
        with:
          name: sprd-cpufreq-modules-${{ github.sha }}
          path: |
            out/drivers/cpufreq/sprd-cpufreq-v2.ko
            out/drivers/cpufreq/sprd-cpufreq-public.ko
            out/drivers/firmware/sprd_sip_svc.ko
          if-no-files-found: error

      # Mali GPU driver (mali_kbase.ko) is NOT part of the in-tree kernel build:
      # it lives in kernel_modules/.../gpu/natt/mali and is built out-of-tree via
      # its own Makefile against the just-built O=out tree. It carries the GPU
      # OC/DVFS changes (T606_GPLL_FREQ in platform/qogirl6).
      #
      # Config notes:
      #  - The driver is built as the Job Manager (JM) interface, NOT CSF: the
      #    stock mali_kbase.ko pulled from the device's /vendor_dlkm defines the
      #    JM scheduler/dispatcher (kbase_jd_submit, kbase_js_*: 11 T kbase_jd_*,
      #    14 T kbase_js_*), kbase_dump_atoms and kbase_trace_gpu_work_period,
      #    with no kbase_csf_* symbols - the T606 GPU is Bifrost-class (JM) and
      #    the vendor userspace (libmali) speaks the JM kbase UAPI. Building
      #    MALI_USE_CSF=1 is unusable anyway: JM-only objects (mali_kbase_jd.c,
      #    mali_kbase_js.c) are excluded by Kbuild:273-288, yet always-built code
      #    (core_linux dump/boost ioctls, trace_gpu_mem.c kbase_trace_gpu_work_period)
      #    touches struct kbase_jd_atom / kctx->jctx, which only exist in JM builds.
      #  - CONFIG_MALI_DEVFREQ=y: required to compile - several always-built files
      #    (mali_kbase_gpu_utilisation_debugfs.c, gpu_stats_debugfs.c, backend
      #    pm_backend/pm_statistics/pm_ca, core_linux suspend) reference struct
      #    kbase_device members that only exist under CONFIG_MALI_DEVFREQ (e.g.
      #    last_frequtil_metrics). Matches the vendor default (Kbuild:86-90
      #    auto-sets it when PM_DEVFREQ + simple_ondemand are =y; the stock ko
      #    imports devfreq_* and create/destroy_gpu_cooling_device). At runtime
      #    devfreq only registers if the DT has operating-points-v2; SPRD instead
      #    scales via the platform DVFS, so this is compile parity with stock.
      #    CONFIG_MALI_MIDGARD_DVFS stays OFF on purpose: the stock ko does NOT
      #    import kbase_platform_dvfs_event, and qogirl6 has no implementation of
      #    it (its governor hooks via kbase_platform_modify_target_freq instead).
      #    With MIDGARD_DVFS=y the call in mali_kbase_pm_metrics.c
      #    (kbase_pm_get_dvfs_action) has no provider and modpost fails.
      #  - mali_kbase.ko imports from two sibling modules, matching the stock
      #    ko's "depends: sprd_gpu_cooling,trusty":
      #      create/destroy_gpu_cooling_device <- drivers/thermal/sprd_gpu_cooling.ko
      #      trusty_fast_call32                  <- drivers/trusty/trusty.ko
      #    They are built right before the mali module so modpost can resolve
      #    the imports (out/Module.symvers records their exports; the mali
      #    build itself is a standalone external-module build).
      #  - CONFIG_MALI_GATOR_SUPPORT=n -> no external gator profiler dependency
      #  - MALI_JIT_PRESSURE_LIMIT_BASE=0 -> matches the vendor build (Kbuild
      #    defaults it to 1).
      #
      # Kernel .config requirements (all already =y in bg6_defconfig): ANDROID,
      # DMA_SHARED_BUFFER, PM_DEVFREQ, DEVFREQ_THERMAL, DEVFREQ_GOV_SIMPLE_ONDEMAND,
      # FW_LOADER, SYNC_FILE. GPU_TRACEPOINTS is not defined in this tree, so the
      # Kbuild guard sees it as unset rather than 'n' and passes.
      - name: Build Mali GPU module (mali_kbase.ko)
        run: |
          make $MAKE_ARGS modules_prepare
          # Build the modules mali_kbase.ko links against (stock ko shows
          # "depends: sprd_gpu_cooling,trusty") so modpost can resolve their
          # exports: create/destroy_gpu_cooling_device (sprd_gpu_cooling.ko)
          # and trusty_fast_call32 (trusty.ko). Their exports land in
          # out/Module.symvers, which the external mali build reads.
          make $MAKE_ARGS -j$(nproc) drivers/thermal/sprd_gpu_cooling.ko drivers/trusty/trusty.ko
          make -C kernel_modules/kernel5.4/gpu/natt/mali \
            KDIR=$PWD/out \
            LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CONFIG_MALI_MIDGARD=m \
            CONFIG_MALI_PLATFORM_NAME=qogirl6 \
            CONFIG_MALI_CSF_SUPPORT=n \
            MALI_USE_CSF=0 \
            CONFIG_MALI_DEVFREQ=y \
            CONFIG_MALI_GATOR_SUPPORT=n \
            MALI_JIT_PRESSURE_LIMIT_BASE=0

      - name: Pack boot.img (magiskboot)
        run: |
          curl -sSL -o /tmp/magisk.apk \
            "$(curl -s https://api.github.com/repos/topjohnwu/Magisk/releases/latest \
               | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url' \
               | head -1)"
          unzip -o -j /tmp/magisk.apk 'lib/x86_64/libmagiskboot.so' -d /tmp
          chmod +x /tmp/libmagiskboot.so
          mkdir -p /tmp/bootwork && cd /tmp/bootwork
          /tmp/libmagiskboot.so unpack "$GITHUB_WORKSPACE/boot-gsi.img"
          cp "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image" kernel
          /tmp/libmagiskboot.so repack "$GITHUB_WORKSPACE/boot-gsi.img"
          mv new-boot.img "$GITHUB_WORKSPACE/boot.img"
          ls -la "$GITHUB_WORKSPACE/boot.img"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image-${{ github.sha }}
          path: out/arch/arm64/boot/Image
          if-no-files-found: warn

      - name: Upload mali_kbase module
        uses: actions/upload-artifact@v4
        with:
          name: mali_kbase-${{ github.sha }}
          path: kernel_modules/kernel5.4/gpu/natt/mali/mali_kbase.ko
          if-no-files-found: warn

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: boot-${{ github.sha }}
          path: boot.img
          if-no-files-found: error