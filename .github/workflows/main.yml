name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches: [ upstream-302, master, susfs, susfs-testing ]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      # NB: keep this a literal -- the `runner` context is not available in
      # jobs.<id>.env, and referencing it there fails workflow validation.
      CLANG_DIR: /tmp/clang-r416183b
      # Mirror of what the vendor's own build config uses:
      #
      #   build.config.common : LLVM=1
      #                         CLANG_PREBUILT_BIN=.../clang-r416183b/bin
      #   build.config.aarch64: ARCH=arm64
      #                         LLVM_IAS=1
      #                         CROSS_COMPILE=aarch64-linux-gnu-
      #
      # The CROSS_COMPILE prefix is load-bearing: it is what supplies clang's
      # target triple.  With ARCH=arm64 alone clang still compiles for the
      # host, and the arm64 inline asm dies with
      # "unknown register name 'x0' in asm" in asm/atomic_lse.h.
      MAKE_ARGS: LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # drivers/kernelsu is a symlink into the KernelSU-Next submodule, and
          # the top-level Makefile is what pulls it in (drivers/Makefile:
          # obj-$(CONFIG_KSU) += kernelsu/).  Without this the link dangles and
          # the build dies with "drivers/kernelsu: No such file or directory".
          submodules: recursive

      # ReSukiSU's kernel/Kbuild derives its version from git (rev-list --count
      # and git describe --abbrev=0 --tags).  actions/checkout below depth 1
      # leaves the submodule shallow and tag-less, so Kbuild falls back to the
      # placeholder "v4.1.0" name and a bogus 30000+1+700 version code.
      # Unshallow and pull tags so the driver reports its real v4.2.0-rc2 tag.
      - name: Expand KernelSU submodule history and tags
        run: |
          git -C KernelSU fetch --unshallow --tags

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # libc6-dev-arm64-cross supplies /usr/aarch64-linux-gnu/include, which
          # usr/include/Makefile adds to the UAPI header self-test.  That test is
          # cross-compiled with a bare AOSP clang and no sysroot, so without it
          # every UAPI header that includes a libc header (linux/virtio_ring.h ->
          # <stdint.h>, linux/dvb/video.h -> <time.h>) fails on a missing
          # glibc multilib header ('bits/libc-header-start.h',
          # 'bits/wordsize.h').  See the comment in usr/include/Makefile.
          sudo apt-get install -y flex bison bc cpio libssl-dev xz-utils dwarves \
            libc6-dev-arm64-cross

      - name: Fetch the reference toolchain (clang-r416183b)
        run: |
          curl -sSL -o /tmp/clang.tar.gz \
            https://codeload.github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b/tar.gz/refs/heads/lineage-20.0
          mkdir -p "$CLANG_DIR"
          tar xzf /tmp/clang.tar.gz -C "$CLANG_DIR" --strip-components=1
          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          clang --version
          ld.lld --version
          llvm-ar --version | head -1

      - name: Show kernel release
        run: |
          make $MAKE_ARGS bg6_defconfig
          echo "kernelrelease: $(make $MAKE_ARGS -s kernelrelease)"

      - name: Build Image
        run: |
          make $MAKE_ARGS -j$(nproc) Image

      - name: Pack boot.img (magiskboot)
        run: |
          curl -sSL -o /tmp/magisk.apk \
            "$(curl -s https://api.github.com/repos/topjohnwu/Magisk/releases/latest \
               | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url' \
               | head -1)"
          unzip -o -j /tmp/magisk.apk 'lib/x86_64/libmagiskboot.so' -d /tmp
          chmod +x /tmp/libmagiskboot.so
          mkdir -p /tmp/bootwork && cd /tmp/bootwork
          /tmp/libmagiskboot.so unpack "$GITHUB_WORKSPACE/boot-gsi.img"
          cp "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image" kernel
          /tmp/libmagiskboot.so repack "$GITHUB_WORKSPACE/boot-gsi.img"
          mv new-boot.img "$GITHUB_WORKSPACE/boot.img"
          ls -la "$GITHUB_WORKSPACE/boot.img"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image-${{ github.sha }}
          path: out/arch/arm64/boot/Image
          if-no-files-found: warn

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: boot-${{ github.sha }}
          path: boot.img
          if-no-files-found: error